<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gautham Sam · Robotics Lead</title>
  <!--@social-->
  <meta name="theme-color" content="#070a0f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070a0f'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23ffb454' stroke-width='3'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/styles.css" />
  <link rel="stylesheet" href="/src/desk.css" />
</head>
<body class="desk-page">
  <!-- the room as a still picture (taken by `npm run stills`): shown at once while the 3D loads, and in
       its place where 3D cannot run. The room fades in over it. -->
  <div id="still" hidden><div class="still-pic"><img alt="" decoding="async" /></div></div>
  <canvas id="room" aria-hidden="true"></canvas>
  <!-- with the still picture, a place from the window is shown as a print (in the room it is in the window) -->
  <figure id="place-print" hidden><img alt="" decoding="async" /></figure>

  <header id="bar">
    <a class="brand" href="./">Gautham Sam</a>
    <a class="cv-link" href="./cv.html" aria-label="CV"><span class="long">CV</span><span class="short">CV</span> <i aria-hidden="true">→</i></a>
  </header>

  <main id="desk-hero"><!--@desk-hero--></main>

  <nav id="dock" aria-label="Things in the room"><!--@desk-dock--></nav>
  <div id="caption" aria-live="polite"><!--@desk-captions--></div>
  <div id="tip" hidden></div>

  <!-- where an object shows what it holds: a board, a notebook, a sheet of paper -->
  <section id="surface" aria-label="Details" hidden>
    <div class="surface-body"></div>
    <button class="close" aria-label="Back to the desk">×</button>
  </section>

  <!-- the second monitor: a computer inside the room -->
  <section id="screen" aria-label="The second monitor: projects" hidden><!--@desk-screen--></section>

  <!-- the note, shown as text only where the room cannot be drawn -->
  <aside id="note-plain" aria-label="A note"><!--@desk-note--></aside>

  <div id="surfaces" hidden><!--@desk-surfaces--></div>
  <script type="application/json" id="desk-data"><!--@desk-data--></script>
  <!--@desk-clock-->
  <!--@desk-devtools-->
  <!--@problems-->
  <!--@preview-->

  <script type="module" src="/src/desk-main.js"></script>
</body>
</html>
