# Builds the site and publishes it to GitHub Pages (Settings → Pages → Source: GitHub Actions).
# A version tag (v1.2.0) builds the same way and makes a GitHub Release instead, with that version's
# CV PDF attached and the tag's message as its notes:
#   git tag -a v1.2.0 -m "notes"  &&  git push origin v1.2.0
name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 3 * * 1' # Mondays, 03:00 UTC: brings the commit chart up to date
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The CV's typeface, so the PDF matches the one made on Gautham's machine
      - name: Install the CV font
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-linuxlibertine

      - run: npm ci

      # From GitHub's public contributions page. If GitHub is unreachable or the page has changed,
      # the site still publishes, with the chart as last saved.
      - name: Refresh the commit chart
        run: npm run refresh-activity
        continue-on-error: true

      - name: Make the CV PDF
        run: npm run cv-pdf
        env:
          BROWSER_PATH: /usr/bin/google-chrome

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The PDF kept on the run's page for a week, to look at
      - uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: public/Gautham-Sam-CV.pdf
          retention-days: 7

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # the site is published from main only (Pages does not take tags); a tag makes a release below
    if: startsWith(github.ref, 'refs/heads/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cv-pdf

      - name: Make the release, with this version's CV
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # the notes are the tag's own message (git tag -a); a tag without one gets its name only
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .message > notes.md 2>/dev/null || echo "$TAG" > notes.md
          mv Gautham-Sam-CV.pdf "Gautham-Sam-CV-$TAG.pdf"
          gh release create "$TAG" "Gautham-Sam-CV-$TAG.pdf" -R "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
