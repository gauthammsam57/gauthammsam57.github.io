# Builds the site and publishes it to GitHub Pages (Settings → Pages → Source: GitHub Actions).
name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Mondays, 03:00 UTC: brings the commit chart up to date
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The CV's typeface, so the PDF matches the one made on Gautham's machine
      - name: Install the CV font
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-linuxlibertine

      - run: npm ci

      # From GitHub's public contributions page. If GitHub is unreachable or the page has changed,
      # the site still publishes, with the chart as last saved.
      - name: Refresh the commit chart
        run: npm run refresh-activity
        continue-on-error: true

      - name: Make the CV PDF
        run: npm run cv-pdf
        env:
          BROWSER_PATH: /usr/bin/google-chrome

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The PDF kept on the run's page for a week, to look at
      - uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: public/Gautham-Sam-CV.pdf
          retention-days: 7

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
